<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Mon Jeu de Plateforme</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #222;
    }
    #conteneur {
      position: relative;
    }
    canvas {
      border: 4px solid #444;
      display: block;
    }
    #boutonRejouer {
      position: absolute;
      top: 220px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 24px;
      font-size: 18px;
      background: #6b8e23;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: none;
    }
    #boutonRejouer:hover {
      background: #7fa62c;
    }
  </style>
</head>
<body>
  <div id="conteneur">
    <canvas id="jeu" width="800" height="400"></canvas>
    <button id="boutonRejouer">Recommencer</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
