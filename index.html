<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mon Jeu de Plateforme</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      background: #222;
    }
    #conteneur {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    #boutonRejouer {
      position: absolute;
      top: 55%;
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 28px;
      font-size: 20px;
      background: #6b8e23;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: none;
      z-index: 10;
    }
    #boutonRejouer:hover {
      background: #7fa62c;
    }
  </style>
</head>
<body>
  <div id="conteneur">
    <canvas id="jeu"></canvas>
    <button id="boutonRejouer">Recommencer</button>
  </div>
  <audio id="musiqueJeu" src="L'Horizon%20de%20Fer.mp3" loop></audio>
  <script src="script.js"></script>
</body>
</html>
